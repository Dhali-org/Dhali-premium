<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Unlock premium content</title>
  <link rel="stylesheet" href="relay.css">
</head>
<body>
  <div class="row">
    <button id="action" type="button" disabled>Loading…</button>
    <span id="badge" class="badge" hidden></span>
    <span id="note" class="note"></span>
  </div>
  <details id="details" class="details" hidden>
    <summary id="details-label">Details from Dhali</summary>
    <p id="details-text"></p>
  </details>
  <div id="wallet" class="wallet" hidden>
    <span id="wallet-account"></span>
    <button id="change" type="button" class="link">Change</button>
  </div>
  <script src="config.js"></script>
  <script src="relay.js"></script>
</body>
</html>
